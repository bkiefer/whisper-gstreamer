[project]
name = "whisper-gstreamer"
version = "1.2.2"
description = "A generic torch & mqtt project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1.0",
    "pyyaml>=6.0",
    "torch<=2.8.0",
    "torchaudio<2.8.0",
]

[[tool.uv.index]]
name = "cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "cu126" }
torchaudio = { index = "cu126" }